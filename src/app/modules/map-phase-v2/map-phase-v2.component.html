<div class="map-wrapper">
  <!-- ส่วนแสดงผลแผนที่ -->
  <div id="cesiumContainer"></div>

  <!-- แผงค้นหา (Search) -->
  <div class="search-panel">
    <div class="search-panel-content">
      <p-autoComplete [(ngModel)]="searchQuery" [suggestions]="suggestions" (completeMethod)="search($event)"
        (onSelect)="selectSearchResult($event)" field="name" placeholder="ค้นหารายชื่อจังหวัด อำเภอ หรือสถานที่..."
        [style]="{ width: '100%' }" [inputStyle]="{ width: '100%' }">
        <ng-template let-result pTemplate="item">
          <div class="search-result-item-prime">
            <svg cIcon [name]="result.icon" size="lg"></svg>
            <div>
              <b>{{ result.name }}</b>
              <div class="type">{{ result.typeLabel }}</div>
            </div>
          </div>
        </ng-template>
      </p-autoComplete>
    </div>
  </div>

  <!-- แผงควบคุมเลเยอร์ (Layer Control) -->
  <div class="layer-control-panel" [class.collapsed]="panelCollapsed">
    <div class="panel-header" (click)="togglePanel()">
      <h3 class="panel-title">
        <span><svg cIcon name="cilMap" size="sm"></svg> การจัดการแผนที่</span>
      </h3>
      <button class="toggle-button">
        {{ panelCollapsed ? '+' : '−' }}
      </button>
    </div>

    <div class="panel-content" *ngIf="!panelCollapsed">
      <div class="layer-controls">

        <!-- Tier 0: Globe -->
        <div class="tier-section">
          <div class="tier-header">
            <input type="checkbox" class="tier-checkbox" [(ngModel)]="tierControls.tier0" (change)="toggleTier0()" />
            <span class="tier-name">🌍 Tier 0: พื้นผิวโลก (Globe)</span>
          </div>
        </div>

        <!-- Tier 1: Terrain -->
        <div class="tier-section">
          <div class="tier-header">
            <input type="checkbox" class="tier-checkbox" [(ngModel)]="tierControls.tier1"
              (change)="setupTier1_Terrain()" />
            <span class="tier-name">🗻 Tier 1: ภูมิประเทศ (Terrain)</span>
          </div>
        </div>

        <!-- Tier 2: Imagery -->
        <div class="tier-section">
          <div class="tier-header" (click)="tierCollapsed.tier2 = !tierCollapsed.tier2">
            <span class="tier-name">🗺️ Tier 2: แผนที่ภาพ (Imagery)</span>
            <svg cIcon [name]="tierCollapsed.tier2 ? 'cilChevronRight' : 'cilChevronBottom'" size="sm"
              class="tier-toggle-icon"></svg>
          </div>
          <div class="tier-layers" *ngIf="!tierCollapsed.tier2">
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.openStreetMapSelf"
                (change)="layers.openStreetMapSelf && (layers.openStreetMapSelf.show = layerControls.openStreetMapSelf)" />
              <span>OSM (GeoServer)</span>
            </label>
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.googleSatellite"
                (change)="layers.googleSatellite && (layers.googleSatellite.show = layerControls.googleSatellite)" />
              <span>Google Satellite</span>
            </label>
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.openStreetMap"
                (change)="layers.openStreetMap && (layers.openStreetMap.show = layerControls.openStreetMap)" />
              <span>OSM Public</span>
            </label>
          </div>
        </div>

        <!-- Tier 3: Vector -->
        <div class="tier-section">
          <div class="tier-header" (click)="tierCollapsed.tier3 = !tierCollapsed.tier3">
            <input type="checkbox" class="tier-checkbox" [(ngModel)]="tierControls.tier3"
              (change)="updateLayerVisibilityByZoom(currentCameraHeight)" (click)="$event.stopPropagation()" />
            <span class="tier-name">📍 Tier 3: ข้อมูลเวกเตอร์ (Features)</span>
            <svg cIcon [name]="tierCollapsed.tier3 ? 'cilChevronRight' : 'cilChevronBottom'" size="sm"
              class="tier-toggle-icon"></svg>
          </div>
          <div class="tier-layers" *ngIf="!tierCollapsed.tier3">
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.provinceBoundaries"
                (change)="updateLayerVisibilityByZoom(currentCameraHeight)" /> ขอบเขตจังหวัด
            </label>
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.districtBoundaries"
                (change)="updateLayerVisibilityByZoom(currentCameraHeight)" /> ขอบเขตอำเภอ
            </label>
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.subDistrictBoundaries"
                (change)="updateLayerVisibilityByZoom(currentCameraHeight)" /> ขอบเขตตำบล (ระวาง)
            </label>
            <hr class="divider">
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.roads"
                (change)="updateLayerVisibilityByZoom(currentCameraHeight)" /> เส้นทางคมนาคม
            </label>
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.waterways"
                (change)="updateLayerVisibilityByZoom(currentCameraHeight)" /> ลำน้ำ/ลำคลอง
            </label>
            <label class="layer-item">
              <input type="checkbox" [(ngModel)]="layerControls.pois"
                (change)="updateLayerVisibilityByZoom(currentCameraHeight)" /> สถานที่สำคัญ (POI)
            </label>
          </div>
        </div>

        <!-- Tier 4: Buildings -->
        <div class="tier-section">
          <div class="tier-header">
            <input type="checkbox" class="tier-checkbox" [(ngModel)]="layerControls.buildings"
              (change)="updateLayerVisibilityByZoom(currentCameraHeight)" />
            <span class="tier-name">🏢 Tier 4: สิ่งปลูกสร้าง 3D</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal แสดงรายละเอียดข้อมูล (Feature Details) -->
  <c-modal [visible]="modalVisible" (visibleChange)="handleModalChange($event)" alignment="top" class="modal-top-right">
    <c-modal-header>
      <h5 cModalTitle>{{ getModalTitle() }}</h5>
      <button (click)="modalVisible = false" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
      <div class="table-responsive">
        <table cTable hover small bordered>
          <tbody>
            <tr *ngFor="let item of getDisplayItems()">
              <td class="fw-bold bg-light" style="width: 40%">{{ item.label }}</td>
              <td>{{ item.value }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </c-modal-body>
    <c-modal-footer>
      <button cButton color="primary" class="px-4">เพิ่มระวางลงตะกร้า</button>
      <button cButton color="secondary" (click)="modalVisible = false">ปิด</button>
    </c-modal-footer>
  </c-modal>

</div>
