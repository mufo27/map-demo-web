<div class="map-wrapper">
  <div id="cesiumContainer"></div>

  <!-- Layer Control Panel (with integrated Search) -->
  <div class="layer-control-panel" [class.collapsed]="panelCollapsed">
    <div class="panel-header" (click)="togglePanel()">
      <h3 class="panel-title">
        <i class="icon-layers"></i>
        <span>Layer Control</span>
      </h3>
      <button class="toggle-button">
        {{ panelCollapsed ? '+' : '−' }}
      </button>
    </div>

    <div class="panel-content" *ngIf="!panelCollapsed">
      <!-- Search Section -->
      <div class="search-section">
        <div class="search-box">
          <i class="search-icon">🔍</i>
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (input)="onSearchInput()"
            placeholder="ค้นหา จังหวัด อำเภอ ตำบล..."
            class="search-input"
          />
          <button
            *ngIf="searchQuery"
            (click)="clearSearch()"
            class="clear-button"
            title="ล้างการค้นหา"
          >
            ✕
          </button>
        </div>

        <div class="search-results" *ngIf="showSearchResults">
          <div
            *ngFor="let result of searchResults"
            class="search-result-item"
            (click)="selectSearchResult(result)"
          >
            <div class="result-icon">{{ result.icon }}</div>
            <div class="result-info">
              <div class="result-name">{{ result.name }}</div>
              <div class="result-type">{{ result.typeLabel }}</div>
            </div>
          </div>

          <div class="no-results" *ngIf="searchResults.length === 0">
            <i>🔍</i>
            <p>ไม่พบผลลัพธ์</p>
          </div>
        </div>
      </div>

      <!-- Layer Controls Section -->
      <div class="layer-controls">
        <!-- OpenStreetMap -->
        <div class="layer-item">
          <label class="layer-label">
            <input
              type="checkbox"
              [(ngModel)]="layerControls.openStreetMap"
              (change)="toggleOpenStreetMap()"
              class="layer-checkbox"
            />
            <span class="layer-name">
              <i class="icon-map"></i>
              Open Street Map
            </span>
          </label>
        </div>

        <!-- Google Maps Satellite -->
        <div class="layer-item">
          <label class="layer-label">
            <input
              type="checkbox"
              [(ngModel)]="layerControls.googleSatellite"
              (change)="toggleGoogleSatellite()"
              class="layer-checkbox"
            />
            <span class="layer-name">
              <i class="icon-satellite"></i>
              Google Satellite
            </span>
          </label>
        </div>

        <div class="divider"></div>

        <!-- Province Boundaries -->
        <div class="layer-item">
          <label class="layer-label">
            <input
              type="checkbox"
              [(ngModel)]="layerControls.provinceBoundaries"
              (change)="toggleProvinceBoundaries()"
              class="layer-checkbox"
            />
            <span class="layer-name">
              <i class="icon-boundary"></i>
              ขอบเขตจังหวัด
            </span>
          </label>
        </div>

        <!-- District Boundaries -->
        <div class="layer-item">
          <label class="layer-label">
            <input
              type="checkbox"
              [(ngModel)]="layerControls.districtBoundaries"
              (change)="toggleDistrictBoundaries()"
              class="layer-checkbox"
            />
            <span class="layer-name">
              <i class="icon-boundary"></i>
              ขอบเขตอำเภอ/ตำบล
            </span>
          </label>
        </div>

        <!-- Roads -->
        <div class="layer-item">
          <label class="layer-label">
            <input
              type="checkbox"
              [(ngModel)]="layerControls.roads"
              (change)="toggleRoads()"
              class="layer-checkbox"
            />
            <span class="layer-name">
              <i class="icon-road"></i>
              ถนน
            </span>
          </label>
        </div>

        <!-- Waterways -->
        <div class="layer-item">
          <label class="layer-label">
            <input
              type="checkbox"
              [(ngModel)]="layerControls.waterways"
              (change)="toggleWaterways()"
              class="layer-checkbox"
            />
            <span class="layer-name">
              <i class="icon-water"></i>
              คลอง/ทางน้ำ
            </span>
          </label>
        </div>
      </div>
    </div>
  </div>
</div>
